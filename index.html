<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veto App</title>
    <!-- استدعاء مكتبات Supabase و Cloudinary -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background-color: #000; color: #fff; overflow: hidden; }
        #videos-feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .video-container { position: relative; width: 100vw; height: 100vh; scroll-snap-align: start; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 20px; pointer-events: none; }
        .bottom-info { pointer-events: auto; }
        .bottom-info h3 { margin-bottom: 10px; font-size: 18px; }
        .bottom-info p { font-size: 14px; }
        .side-actions { display: flex; flex-direction: column; align-items: center; gap: 20px; pointer-events: auto; }
        .action-btn { text-align: center; font-size: 30px; cursor: pointer; }
        .action-btn span { font-size: 12px; display: block; margin-top: 5px; }
        .loading { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 24px; }

        /* زر الرفع للمستخدم */
        #upload-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #ff0050;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- الزر الذي سيستخدمه المشترك العادي -->
    <button id="upload-btn">+ رفع فيديو</button>

    <div id="videos-feed">
        <div class="loading">جاري تحميل الفيديوهات...</div>
    </div>

    <script>
        // ⚠️⚠️ هنا تضع المفاتيح التي أرسلتها ⚠️⚠️
        // 1. ابحث عن "Project URL" في أعلى شاشة إعدادات API في Supabase وانسخه هنا:
        const SUPABASE_URL = 'ضع_هنا_رابط_المشروع_Project_URL';
        
        // 2. المفتاح الذي أرسلته لي في الصورة (Publishable key):
        const SUPABASE_KEY = 'sb_publishable_R1ywm...'; // انسخ المفتاح كاملاً من Supabase وضعه هنا
        
        // 3. إعدادات Cloudinary (التي أرسلت لي اسم حسابك فيها geuq0m9p):
        const CLOUDINARY_CLOUD_NAME = 'geuq0m9p'; 
        const CLOUDINARY_UPLOAD_PRESET = 'ml_default'; 

        // إعداد الاتصال بقاعدة البيانات
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // دالة جلب الفيديوهات وعرضها
        async function loadVideos() {
            const feedContainer = document.getElementById('videos-feed');
            feedContainer.innerHTML = ''; 

            try {
                const { data, error } = await _supabase
                    .from('videos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    feedContainer.innerHTML = '<div class="loading">لا توجد فيديوهات. كن أول من يرفع!</div>';
                    return;
                }

                data.forEach((file) => {
                    const videoElement = document.createElement('div');
                    videoElement.className = 'video-container';
                    videoElement.innerHTML = `
                        <video src="${file.video_url}" autoplay loop muted playsinline></video>
                        <div class="overlay">
                            <div class="bottom-info">
                                <h3>${file.username || '@مستخدم'}</h3>
                                <p>فيديو جديد</p>
                            </div>
                            <div class="side-actions">
                                <div class="action-btn">❤️<br><span>0</span></div>
                                <div class="action-btn">💬<br><span>0</span></div>
                            </div>
                        </div>
                    `;
                    feedContainer.appendChild(videoElement);
                });
            } catch (error) {
                console.error("خطأ:", error);
                feedContainer.innerHTML = '<div class="loading">حدث خطأ في تحميل الفيديوهات.</div>';
            }
        }

        // إعداد نافذة رفع الفيديو (Cloudinary)
        const myWidget = cloudinary.createUploadWidget({
            cloudName: CLOUDINARY_CLOUD_NAME, 
            uploadPreset: CLOUDINARY_UPLOAD_PRESET,
            resourceType: 'video'
        }, (error, result) => { 
            if (!error && result && result.event === "success") { 
                saveVideoToDatabase(result.info.secure_url);
            }
        });

        // حفظ رابط الفيديو في قاعدة البيانات
        async function saveVideoToDatabase(videoUrl) {
            try {
                await _supabase
                    .from('videos')
                    .insert([{ video_url: videoUrl, username: '@مستخدم_تجريبي' }]);
                loadVideos(); // تحديث الشاشة فوراً
            } catch (error) {
                alert("فشل حفظ الفيديو.");
            }
        }

        // تفعيل زر الرفع
        document.getElementById("upload-btn").addEventListener("click", function(){
            myWidget.open();
        }, false);

        loadVideos();
    </script>
</body>
</html>
