<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veto App</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background-color: #000; color: #fff; overflow: hidden; }
        #videos-feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .video-container { position: relative; width: 100vw; height: 100vh; scroll-snap-align: start; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 20px; pointer-events: none; }
        .bottom-info { pointer-events: auto; }
        .bottom-info h3 { margin-bottom: 10px; font-size: 18px; }
        .bottom-info p { font-size: 14px; }
        .side-actions { display: flex; flex-direction: column; align-items: center; gap: 20px; pointer-events: auto; }
        .action-btn { text-align: center; font-size: 30px; cursor: pointer; }
        .action-btn span { font-size: 12px; display: block; margin-top: 5px; }
        .loading { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 24px; }

        #upload-btn {
            position: fixed; top: 20px; right: 20px; background-color: #ff0050;
            color: white; border: none; padding: 10px 20px; font-size: 18px;
            font-weight: bold; border-radius: 20px; cursor: pointer; z-index: 1000;
        }
        #file-input { display: none; }
    </style>
</head>
<body>
    <button id="upload-btn">+ رفع فيديو</button>
    <input type="file" id="file-input" accept="video/*">
    <div id="videos-feed"><div class="loading">جاري تحميل الفيديوهات...</div></div>

    <script>
        // ⚠️ هنا تضع رابط مشروعك والمفتاح (الذي أرسلته لي سابقاً)
        const SUPABASE_URL = 'https://fjhoczwmvslylnhfn.supabase.co'; // اكتب الرابط كاملاً هنا
        const SUPABASE_KEY = 'sb_publishable_R1ywm...'; // ضع المفتاح كاملاً هنا
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // دالة جلب الفيديوهات من الـ Bucket
        async function loadVideos() {
            const feedContainer = document.getElementById('videos-feed');
            feedContainer.innerHTML = ''; 

            try {
                // جلب قائمة الملفات من مساحة "videos"
                const { data, error } = await _supabase.storage.from('videos').list();

                if (error) throw error;

                if (!data || data.length === 0) {
                    feedContainer.innerHTML = '<div class="loading">لا توجد فيديوهات.</div>';
                    return;
                }

                data.forEach((file) => {
                    // توليد الرابط المباشر لكل ملف
                    const { data: urlData } = _supabase.storage.from('videos').getPublicUrl(file.name);
                    const videoUrl = urlData.publicUrl;

                    const videoElement = document.createElement('div');
                    videoElement.className = 'video-container';
                    videoElement.innerHTML = `
                        <video src="${videoUrl}" autoplay loop muted playsinline></video>
                        <div class="overlay">
                            <div class="bottom-info">
                                <h3>@مستخدم_جديد</h3>
                                <p>${file.name}</p>
                            </div>
                            <div class="side-actions">
                                <div class="action-btn">❤️<br><span>0</span></div>
                                <div class="action-btn">💬<br><span>0</span></div>
                            </div>
                        </div>
                    `;
                    feedContainer.appendChild(videoElement);
                });
            } catch (error) {
                console.error("خطأ في جلب الفيديوهات:", error);
                feedContainer.innerHTML = '<div class="loading">حدث خطأ. تأكد من إعدادات Bucket (يجب أن يكون Public).</div>';
            }
        }

        // دالة رفع الفيديو الجديد
        document.getElementById('upload-btn').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const fileName = `video_${Date.now()}.mp4`; // اسم فريد للفيديو
            
            // رفع الفيديو إلى Supabase
            const { data, error } = await _supabase.storage.from('videos').upload(fileName, file);

            if (error) {
                alert("فشل رفع الفيديو: " + error.message);
            } else {
                alert("تم رفع الفيديو بنجاح!");
                loadVideos(); // تحديث الشاشة لعرضه فوراً
            }
        });

        // تشغيل الجلب عند فتح الصفحة
        loadVideos();
    </script>
</body>
</html>
