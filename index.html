<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veto - منصة الفيديو</title>
    <!-- استدعاء مكتبة Appwrite -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #000; color: #fff; overflow-y: scroll; scroll-snap-type: y mandatory; height: 100vh; }
        .video-container { position: relative; width: 100vw; height: 100vh; scroll-snap-align: start; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 20px; pointer-events: none; }
        .bottom-info { pointer-events: auto; }
        .bottom-info h3 { margin-bottom: 10px; font-size: 18px; }
        .bottom-info p { font-size: 14px; }
        .side-actions { display: flex; flex-direction: column; align-items: center; gap: 20px; pointer-events: auto; }
        .action-btn { text-align: center; font-size: 30px; cursor: pointer; }
        .action-btn span { font-size: 12px; display: block; margin-top: 5px; }
        .loading { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 24px; }
    </style>
</head>
<body>
    <!-- حاوية سيتم وضع الفيديوهات داخلها -->
    <div id="videos-feed">
        <div class="loading">جاري تحميل الفيديوهات...</div>
    </div>

    <script>
        const { Client, Storage } = Appwrite;
        
        // 1. إعداد الاتصال بـ Appwrite
        const client = new Client()
            .setEndpoint('https://cloud.appwrite.io/v1') 
            .setProject('6ade156900082102d9ba'); // Project ID الخاص بك
            
        const storage = new Storage(client);
        const BUCKET_ID = '6b01f65500371f088628'; // Bucket ID الخاص بك

        // 2. دالة لجلب الفيديوهات
        async function loadVideos() {
            const feedContainer = document.getElementById('videos-feed');
                        feedContainer.innerHTML = ''; // مسح شاشة التحميل
            
            // الحل الجذري: عرض الفيديوهات مباشرة بدون طلب قائمة
            const fallbackVideos = [
                "https://cloud.appwrite.io/v1/storage/buckets/6b01f65500371f088628/files/6b02921d002a895f6d65/view?project=6ade156900082102d9ba",
                "https://cloud.appwrite.io/v1/storage/buckets/6b01f65500371f088628/files/6b0291f4001cc6dcb5e8/view?project=6ade156900082102d9ba"
            ];
            
            fallbackVideos.forEach(videoUrl => {
                const videoElement = document.createElement('div');
                videoElement.className = 'video-container';
                videoElement.innerHTML = `
                    <video src="${videoUrl}" autoplay loop muted playsinline></video>
                    <div class="overlay">
                        <div class="bottom-info"><h3>@مستخدم_جديد</h3><p>فيديو تجريبي</p></div>
                        <div class="side-actions"><div class="action-btn">❤️<br><span>0</span></div></div>
                    </div>
                `;
                feedContainer.appendChild(videoElement);
            });
            
            // إيقاف الكود هنا لأننا عرضنا الفيديوهات
            return; 

            try {
                // جلب قائمة الملفات من Appwrite
                const response = await storage.listFiles(BUCKET_ID);
                
                // التأكد من وجود ملفات
                if (response.files.length === 0) {
                    feedContainer.innerHTML = '<div class="loading">لا توجد فيديوهات حالياً.</div>';
                    return;
                }

                // 3. إنشاء شاشة لكل فيديو
                response.files.forEach(file => {
                    // رابط الفيديو المباشر
                    const videoUrl = `https://cloud.appwrite.io/v1/storage/buckets/${BUCKET_ID}/files/${file.$id}/view?project=6ade156900082102d9ba`;

                    // بناء واجهة الفيديو
                    const videoElement = document.createElement('div');
                    videoElement.className = 'video-container';
                    videoElement.innerHTML = `
                        <video src="${videoUrl}" autoplay loop muted playsinline></video>
                        <div class="overlay">
                            <div class="bottom-info">
                                <h3>@مستخدم_جديد</h3>
                                <p>${file.name} (فيديو تجريبي)</p>
                            </div>
                            <div class="side-actions">
                                <div class="action-btn">❤️<br><span>0</span></div>
                                <div class="action-btn">💬<br><span>0</span></div>
                            </div>
                        </div>
                    `;
                    
                    feedContainer.appendChild(videoElement);
                });

            } catch (error) {
                console.error("خطأ في جلب الفيديوهات:", error);
                
                            } catch (error) {
                console.error("خطأ في جلب الفيديوهات:", error);
                // حل بديل: إذا فشل الاتصال، سنعرض الفيديوهات التي نعرف روابطها مباشرة
                const fallbackVideos = [
                    "https://cloud.appwrite.io/v1/storage/buckets/6b01f65500371f088628/files/6b02921d002a895f6d65/view?project=6ade156900082102d9ba",
                    "https://cloud.appwrite.io/v1/storage/buckets/6b01f65500371f088628/files/6b0291f4001cc6dcb5e8/view?project=6ade156900082102d9ba"
                ];
                
                fallbackVideos.forEach(videoUrl => {
                    const videoElement = document.createElement('div');
                    videoElement.className = 'video-container';
                    videoElement.innerHTML = `
                        <video src="${videoUrl}" autoplay loop muted playsinline></video>
                        <div class="overlay">
                            <div class="bottom-info"><h3>@مستخدم_جديد</h3><p>فيديو تجريبي</p></div>
                            <div class="side-actions"><div class="action-btn">❤️<br><span>0</span></div></div>
                        </div>
                    `;
                    document.getElementById('videos-feed').appendChild(videoElement);
                });
            }
            }
        }

        // تشغيل الدالة عند فتح الصفحة
        loadVideos();
    </script>
    <style>
    html, body { margin: 0 !important; padding: 0 !important; height: 100% !important; overflow: hidden !important; }
    #videos-feed { height: 100vh !important; overflow-y: scroll !important; scroll-snap-type: y mandatory !important; }
    .video-container { width: 100vw !important; height: 100vh !important; scroll-snap-align: start !important; }
    video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
</style>
</body>
</html>
