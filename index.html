<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veto App</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background-color: #000; color: #fff; overflow: hidden; }
        #videos-feed { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .video-container { position: relative; width: 100vw; height: 100vh; scroll-snap-align: start; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 20px; pointer-events: none; }
        .bottom-info { pointer-events: auto; }
        .bottom-info h3 { margin-bottom: 10px; font-size: 18px; }
        .bottom-info p { font-size: 14px; }
        .side-actions { display: flex; flex-direction: column; align-items: center; gap: 20px; pointer-events: auto; }
        .action-btn { text-align: center; font-size: 30px; cursor: pointer; }
        .action-btn span { font-size: 12px; display: block; margin-top: 5px; }
        .loading { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 24px; }
    </style>
</head>
<body>
    <div id="videos-feed">
        <div class="loading">جاري تحميل الفيديوهات...</div>
    </div>

    <script>
        const PROJECT_ID = '6ade156900082102d9ba';
        const BUCKET_ID = '6b01f65500371f088628';
        
        // هذا الرابط يجلب قائمة الملفات مباشرة من خوادم Appwrite بدون حماية CORS
        const API_URL = `https://cloud.appwrite.io/v1/storage/buckets/${BUCKET_ID}/files?queries[]=limit(100)`;

        async function loadVideos() {
            const feedContainer = document.getElementById('videos-feed');
            
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    headers: {
                        'X-Appwrite-Project': PROJECT_ID,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (!data.files || data.files.length === 0) {
                    feedContainer.innerHTML = '<div class="loading">لا توجد فيديوهات متاحة.</div>';
                    return;
                }

                feedContainer.innerHTML = ''; // مسح شاشة التحميل

                data.files.forEach(file => {
                    const videoUrl = `https://cloud.appwrite.io/v1/storage/buckets/${BUCKET_ID}/files/${file.$id}/view?project=${PROJECT_ID}`;

                    const videoElement = document.createElement('div');
                    videoElement.className = 'video-container';
                    videoElement.innerHTML = `
                        <video src="${videoUrl}" autoplay loop muted playsinline></video>
                        <div class="overlay">
                            <div class="bottom-info">
                                <h3>@مستخدم_جديد</h3>
                                <p>${file.name}</p>
                            </div>
                            <div class="side-actions">
                                <div class="action-btn">❤️<br><span>0</span></div>
                                <div class="action-btn">💬<br><span>0</span></div>
                            </div>
                        </div>
                    `;
                    feedContainer.appendChild(videoElement);
                });

            } catch (error) {
                console.error("خطأ:", error);
                feedContainer.innerHTML = '<div class="loading">حدث خطأ في الاتصال. يرجى المحاولة لاحقاً.</div>';
            }
        }

        loadVideos();
    </script>
</body>
</html>
